name: churp
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - setuptools
  - wheel
  - cython

  # Core Data & Math (installed via Conda FIRST)
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - tqdm

  # Audio processing & Visualization
  - librosa
  - matplotlib
  - seaborn
  - ipython
  - jupyter
  - ipykernel
  - pyqtgraph
  - pyqt

  # Clustering
  - hdbscan
  - umap-learn

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124

      # PyTorch CUDA builds
      - torch
      - torchvision
      - torchaudio

      # Packages to install via PyPI / Pip
      - soundfile
      - hmmlearn
      - glasbey
      - iisignature
      - shutil-extra
