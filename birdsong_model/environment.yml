name: churp
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - setuptools
  - wheel
  - cython

  # Core Data & Math (installed via Conda FIRST so C-extensions build cleanly)
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - tqdm

  # Audio processing
  - librosa
  - soundfile

  # Visualization & Tools
  - matplotlib
  - seaborn
  - ipython
  - jupyter
  - ipykernel
  - pyqtgraph
  - pyqt

  # Clustering
  - hdbscan
  - umap-learn

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124

      # PyTorch CUDA builds
      - torch
      - torchvision
      - torchaudio

      # Specialized packages requiring pre-installed NumPy
      - hmmlearn
      - glasbey
      - iisignature
      - shutil-extra
